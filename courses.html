/* =========================================================

let courses = [];

let activeWeek = null; // null = default to the current calendar week

const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function dayIndex(name){
  if(!name) return 4;
  const i = DAY_NAMES.findIndex(d => d.toLowerCase() === String(name).trim().toLowerCase());
  return i === -1 ? 4 : i;
}
function fmtDate(d){ return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}); }
function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function todayStart(){ return startOfDay(new Date()); }
function sameDay(a,b){ return startOfDay(a).getTime() === startOfDay(b).getTime(); }

/* =========================================================
   INIT / LOAD
========================================================= */

async function saveTasks(courseId){ await S.set('tasks:'+courseId, tasksByCourse[courseId] || []); }

/* =========================================================
   SCHEDULE COMPRESSION
   8-week SEU term -> modules 1-7 map 1:1 onto 7 calendar weeks;
   module 8's work folds into week 7. Every task lands on a real
   Monday-Friday day for that calendar week — never a weekend —
   and exams always land on the last working day of their week,
   after the regular work that leads up to them.
========================================================= */
function compressedWeekOf(week){ return Math.min(7, Math.ceil(week * 7/8)); }

function getCourseWeekDates(course){
  const weeks = [];
  let cursor = startOfDay(new Date(course.startDate + 'T00:00:00'));
  const dow0 = cursor.getDay();
  if(dow0 === 0) cursor = addDays(cursor, 1);
  else if(dow0 === 6) cursor = addDays(cursor, 2);
  for(let w=0; w<7; w++){
    const startDow = cursor.getDay();
    const daysToFriday = 5 - startDow;
    const weekdays = [];
    for(let i=0; i<=daysToFriday; i++) weekdays.push(addDays(cursor, i));
    weeks.push(weekdays);
    let next = addDays(weekdays[weekdays.length-1], 1);
    while(next.getDay() !== 1) next = addDays(next, 1);
    cursor = next;
  }
  return weeks;
}

function dateForNamedDay(weekdays, dayName, fallbackIndex){
  const idx = dayIndex(dayName);
  const jsDay = (idx + 1) % 7;
  const match = weekdays.find(d => d.getDay() === jsDay);
  return match || weekdays[fallbackIndex % weekdays.length];
}

// Builds the task list for a course from an extracted syllabus item
// array. Regular items with no stated day are spread across the
// week's working days in their ORIGINAL ORDER using a proportional
// (non-wrapping) mapping, so item 6 of 6 never jumps back to Monday
// ahead of item 5 — order is always preserved. Exams always land on
// the last working day of the week.
function buildTasksFromExtraction(course, extractedRaw){
  const weekDates = getCourseWeekDates(course);
  const extracted = extractedRaw.map((item, idx) => ({
    ...item,
    week: Math.min(8, Math.max(1, parseInt(item.week) || 1)),
    _orderIndex: idx
  }));

  const byCW = {};
  for(const item of extracted){
    const cw = compressedWeekOf(item.week);
    (byCW[cw] = byCW[cw] || []).push(item);
  }

  for(const cw of Object.keys(byCW)){
    const weekdays = weekDates[cw-1];
    const itemsInWeek = byCW[cw];
    const hasAutoExam = itemsInWeek.some(it => it.type==='exam' && !it.dueDayOfWeek);
    const pool = (hasAutoExam && weekdays.length > 1) ? weekdays.slice(0,-1) : weekdays;
    const regularAuto = itemsInWeek.filter(it =>
      !it.dueDayOfWeek && it.type !== 'exam' &&
      !(it.type === 'discussion' && (it.initialPostDay || it.replyDay))
    );
    const N = regularAuto.length, D = pool.length;
    regularAuto.forEach((item, i) => {
      const dayIdx = D > 0 ? Math.min(D-1, Math.floor(i * D / N)) : 0;
      item._autoDate = pool[dayIdx];
    });
  }

  const tasks = [];
  let counter = 0;
  for(const item of extracted){
    const week = item.week;
    const cw = compressedWeekOf(week);
    const weekdays = weekDates[cw-1];
    const baseId = course.id + '-' + (counter++) + '-' + Date.now();
    if(item.type === 'discussion' && (item.initialPostDay || item.replyDay)){
      const initDay = item.initialPostDay || 'Thursday';
      const replyDay = item.replyDay || 'Friday';
      tasks.push({
        id: baseId+'-init', courseId: course.id, week, orderIndex: item._orderIndex,
        title: item.title + ' — initial post', type: 'discussion',
        dueDate: dateForNamedDay(weekdays, initDay, 0).toISOString(),
        explicitDay: initDay, done: false, notes: item.notes || ''
      });
      tasks.push({
        id: baseId+'-reply', courseId: course.id, week, orderIndex: item._orderIndex,
        title: item.title + ' — replies', type: 'discussion',
        dueDate: dateForNamedDay(weekdays, replyDay, 0).toISOString(),
        explicitDay: replyDay, done: false, notes: item.notes || ''
      });
    } else {
      const explicitDay = item.dueDayOfWeek || null;
      let d;
      if(explicitDay) d = dateForNamedDay(weekdays, explicitDay, 0);
      else if(item.type === 'exam') d = weekdays[weekdays.length-1];
      else d = item._autoDate || weekdays[0];
      tasks.push({
        id: baseId, courseId: course.id, week, orderIndex: item._orderIndex,
        title: item.title, type: item.type || 'assignment',
        dueDate: d.toISOString(), explicitDay, done: false, notes: item.notes || ''
      });
    }
  }
  tasks.sort((a,b)=> new Date(a.dueDate) - new Date(b.dueDate));
  return tasks;
}

function recomputeCourseDates(courseId){
  const course = courses.find(c=>c.id===courseId);
  const tasks = tasksByCourse[courseId] || [];
  const weekDates = getCourseWeekDates(course);
  const byCW = {};
  for(const t of tasks){
    const cw = compressedWeekOf(t.week);
    (byCW[cw] = byCW[cw] || []).push(t);
  }
  for(const cw of Object.keys(byCW)){
    const weekdays = weekDates[cw-1];
    const itemsInWeek = byCW[cw].slice().sort((a,b)=> (a.orderIndex ?? 0) - (b.orderIndex ?? 0));
    const hasAutoExam = itemsInWeek.some(t => t.type==='exam' && !t.explicitDay);
    const pool = (hasAutoExam && weekdays.length > 1) ? weekdays.slice(0,-1) : weekdays;
    const regularAuto = itemsInWeek.filter(t => !t.explicitDay && t.type !== 'exam');
    const N = regularAuto.length, D = pool.length;
    regularAuto.forEach((t, i) => {
      const dayIdx = D > 0 ? Math.min(D-1, Math.floor(i * D / N)) : 0;
      t.dueDate = pool[dayIdx].toISOString();
    });
    for(const t of itemsInWeek){
      if(t.explicitDay) t.dueDate = dateForNamedDay(weekdays, t.explicitDay, 0).toISOString();
      else if(t.type === 'exam') t.dueDate = weekdays[weekdays.length-1].toISOString();
    }
  }
}

/* =========================================================
   AI SYLLABUS PARSING
========================================================= */
async function parseSyllabusText(rawText){
  const system = `You extract a structured task list from a college course syllabus for an accelerated 8-week SEU (Southeastern University) online term.
Return ONLY valid JSON — no markdown fences, no preamble, no commentary. The JSON must be an array of objects with this exact shape:
[{"week": 1, "title": "string", "type": "discussion"|"assignment"|"quiz"|"exam"|"reading"|"other", "dueDayOfWeek": "Monday".."Sunday" or null, "initialPostDay": "Monday".."Sunday" or null, "replyDay": "Monday".."Sunday" or null, "notes": "string, short"}]
Rules:
- Include every graded item: discussion boards, quizzes, exams, papers, assignments, projects.
- For discussion board items, if the syllabus states separate initial-post and reply deadlines, fill initialPostDay and replyDay and leave dueDayOfWeek null. If only one deadline is given, use dueDayOfWeek and leave the other two null.
- "week" is the module/week number (1-8) the item belongs to, inferred from the syllabus structure.
- If a day of week isn't stated, use null — do not guess. (The app auto-spreads unstated days across Mon-Fri, and always schedules exams after that week's other work.)
- Keep "notes" under 12 words (e.g. page count, submission format).
- Do not invent items that aren't in the text.`;

  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 4000,
      system,
      messages: [{ role: "user", content: rawText.slice(0, 40000) }]
    })
  });
  const data = await resp.json();
  const textBlocks = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  let clean = textBlocks.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const parsed = JSON.parse(clean);
  if(!Array.isArray(parsed)) throw new Error('Unexpected response shape');
  return parsed;
}

/* =========================================================
   SHARED DISPLAY HELPERS
========================================================= */
function allTasksFlat(){
  let all = [];
  for(const c of courses){
    for(const t of (tasksByCourse[c.id]||[])){
      all.push({...t, courseName: c.name, courseCode: c.code});
    }
  }
  return all;
}

function typeLabel(type){
  const map = {discussion:'Discussion', assignment:'Assignment', quiz:'Quiz', exam:'Exam', reading:'Reading', other:'Task'};
  return map[type] || 'Task';
}

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML; }

function taskRow(t, overdue){
  const d = new Date(t.dueDate);
  const statusBadge = overdue ? `<span class="badge overdue">Overdue</span>` :
    sameDay(d, todayStart()) ? `<span class="badge today">Today</span>` : '';
  return `
    <div class="task">
      <div class="check ${t.done?'done':''}" onclick="toggleDone('${t.courseId}','${t.id}')">${t.done?'✓':''}</div>
      <div class="task-body">
        <div class="task-title ${t.done?'done':''}">${escapeHtml(t.title)}</div>
        <div class="task-meta">
          <span class="badge ${t.type}">${typeLabel(t.type)}</span>
          ${statusBadge}
          <span class="course-chip">${escapeHtml(t.courseCode||t.courseName||'')}</span>
          <span class="mono">· ${fmtDate(d)}</span>
        </div>
        ${t.notes?`<div class="helper">${escapeHtml(t.notes)}</div>`:''}
      </div>
    </div>`;
}

async function toggleDone(courseId, taskId){
  const list = tasksByCourse[courseId];
  const t = list.find(x=>x.id===taskId);
  if(!t) return;
  t.done = !t.done;
  await saveTasks(courseId);
  render();
}

function groupTasksByCourse(list){
  const groups = {};
  for(const c of courses) groups[c.id] = [];
  for(const t of list){ (groups[t.courseId] = groups[t.courseId] || []).push(t); }
  return groups;
}

function renderSubjectGroups(list, overdue){
  if(!list.length) return '';
  const groups = groupTasksByCourse(list);
  let html = '';
  for(const c of courses){
    const items = groups[c.id] || [];
    if(!items.length) continue;
    html += `<div class="subject-label">${escapeHtml(c.name)}</div>`;
    html += `<div class="card">${items.map(t=>taskRow(t, overdue)).join('')}</div>`;
  }
  return html;
}

function renderDayByDayGroups(list){
  const byDate = {};
  for(const t of list){
    const key = startOfDay(new Date(t.dueDate)).toISOString();
    (byDate[key] = byDate[key] || []).push(t);
  }
  const keys = Object.keys(byDate).sort();
  let html = '';
  for(const key of keys){
    const d = new Date(key);
    html += `<div class="day-block">
      <div class="day-heading">${d.toLocaleDateString(undefined,{weekday:'long'})} <span class="date-mono">${d.toLocaleDateString(undefined,{month:'short', day:'numeric'})}</span></div>
      ${renderSubjectGroups(byDate[key])}
    </div>`;
  }
  return html;
}

/* =========================================================
   SCHEDULE SCREEN — continuous Week 1-7 scroll
========================================================= */
function renderSchedulePage(){
  document.getElementById('headerActionBtn').textContent = '⚙ Courses';

  if(courses.length === 0){
    document.getElementById('scoreboardTitle').textContent = 'Game Plan';
    document.getElementById('scoreboardSub').textContent = 'No courses loaded yet';
    document.getElementById('chipRow').innerHTML = '';
    document.getElementById('mainContent').innerHTML = `
      <div class="empty">
        <span class="wordmark">No game plan yet</span>
        <p>Add his first SEU course and load the syllabus to build the 7-week schedule.</p>
        <button class="btn gold" onclick="openAddCourse()">+ Add a course</button>
        <button class="btn ghost" style="margin-top:10px;" onclick="seedFall26()">Preload Fall '26: Composition &amp; Algebra</button>
      </div>`;
    return;
  }

  const course0 = courses[0];
  const weekDatesAll = getCourseWeekDates(course0);
  const now = todayStart();
  let currentIdx = weekDatesAll.findIndex(wd => now >= wd[0] && now <= wd[wd.length-1]);
  if(currentIdx === -1) currentIdx = (now < weekDatesAll[0][0]) ? 0 : 6;

  const all = allTasksFlat();
  const overdue = all.filter(t=>!t.done && startOfDay(new Date(t.dueDate)) < now);
  const doneCount = all.filter(t=>t.done).length;

  document.getElementById('scoreboardTitle').textContent = `Week ${currentIdx+1} of 7`;
  document.getElementById('scoreboardSub').textContent = `${doneCount}/${all.length} complete · ${overdue.length} overdue`;

  if(activeWeek === null) activeWeek = currentIdx+1;

  let chipHtml = '';
  for(let w=1; w<=7; w++){
    const label = w===7 ? 'Wk 7' : `Wk ${w}`;
    chipHtml += `<div class="wk-chip ${w===activeWeek?'current':''}" onclick="selectWeek(${w})">${label}</div>`;
  }
  document.getElementById('chipRow').innerHTML = chipHtml;

  let html = '';
  if(overdue.length){
    html += `<div class="section-label">⏱ Overdue — catch up</div>`;
    html += renderSubjectGroups(overdue, true);
  }

  const w = activeWeek;
  const weekdays = weekDatesAll[w-1];
  const rangeStart = weekdays[0], rangeEnd = weekdays[weekdays.length-1];
  const weekTasks = all.filter(t=>{
    const d = startOfDay(new Date(t.dueDate));
    return d >= rangeStart && d <= rangeEnd;
  });
  const wDone = weekTasks.filter(t=>t.done).length;
  html += `<section class="qtr" id="week-section-${w}">
    <div class="qtr-head">
      <div class="qtr-tag">WK ${w}</div>
      <div class="qtr-title">${w===7 ? 'Modules 7–8' : 'Module '+w}</div>
      <div class="qtr-hint">${fmtDate(rangeStart)} – ${fmtDate(rangeEnd)} · ${wDone}/${weekTasks.length} done</div>
    </div>
    ${weekTasks.length ? renderDayByDayGroups(weekTasks) : `<div class="card" style="padding:12px; color:var(--ink-soft); font-size:13.5px;">Nothing scheduled this week yet.</div>`}
  </section>`;

  document.getElementById('mainContent').innerHTML = html;
}

function selectWeek(w){
  activeWeek = w;
  renderSchedulePage();
}

function openCourseDetail(id){ activeCourseId = id; render(); }
function backToCourseList(){ activeCourseId = null; render(); }

function renderCourseDetail(id){
  const c = courses.find(x=>x.id===id);
  if(!c){ activeCourseId=null; render(); return; }
  const tasks = tasksByCourse[id] || [];

  let html = `<button class="link-btn" onclick="backToCourseList()">‹ All courses</button>`;
  html += `<div class="section-label">${escapeHtml(c.name)}</div>`;
  html += `<div class="card" style="padding:12px 14px;">
      <div class="helper">${escapeHtml(c.code||'')} · 8-week SEU term starting ${fmtDate(new Date(c.startDate+'T00:00:00'))}, target finish by end of week 7</div>
      <button class="link-btn" style="margin-top:8px;" onclick="openEditCourse('${c.id}')">Edit name / start date</button>
    </div>`;

  if(!tasks.length){
    html += `
      <div class="section-label">Load the syllabus</div>
      <div class="card" style="padding:14px;">
        <p class="helper" style="margin-top:0;">Upload the syllabus PDF, or paste its text below.</p>
        <label class="field-label">Upload PDF</label>
        <input type="file" id="syllabusPdfInput" accept="application/pdf" onchange="handlePdfUpload(event,'${c.id}')">
        <div id="pdfStatus" class="helper"></div>
        <label class="field-label" style="margin-top:16px;">Or paste syllabus text</label>
        <textarea id="syllabusText" placeholder="Paste syllabus text here…"></textarea>
        <div id="parseError" style="color:var(--danger); font-size:13px; margin-top:6px;"></div>
        <button class="btn gold" style="margin-top:10px;" id="parseBtn" onclick="handleParse('${c.id}')">Parse syllabus</button>
      </div>`;
  } else {
    html += `<div class="section-label">Full schedule (${tasks.length} items)</div>`;
    html += `<div class="card">`;
    let lastWeek = null;
    for(const t of tasks.slice().sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate))){
      if(t.week !== lastWeek){
        html += `<div class="subject-label" style="margin-top:10px;">Module ${t.week}</div>`;
        lastWeek = t.week;
      }
      html += taskRow({...t, courseCode:c.code, courseName:c.name});
    }
    html += `</div>`;
    html += `<button class="btn danger-ghost" style="margin-top:10px;" onclick="resetCourseTasks('${c.id}')">Re-parse syllabus (replaces current schedule)</button>`;
  }

  html += `<button class="btn ghost" style="margin-top:20px;" onclick="deleteCourse('${c.id}')">Remove this course</button>`;
  document.getElementById('mainContent').innerHTML = html;
}

async function resetCourseTasks(courseId){
  if(!confirm('This clears the current schedule for this course so you can paste a new syllabus. Continue?')) return;
  tasksByCourse[courseId] = [];
  await saveTasks(courseId);
  render();
}

async function deleteCourse(courseId){
  if(!confirm('Remove this course and its schedule? This cannot be undone.')) return;
  courses = courses.filter(c=>c.id!==courseId);
  delete tasksByCourse[courseId];
  await saveCourses();
  activeCourseId = null;
  activeWeek = null;
  render();
}

/* =========================================================
   PDF UPLOAD -> TEXT EXTRACTION (pdf.js, runs client-side)
========================================================= */
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

async function handlePdfUpload(evt, courseId){
  const file = evt.target.files[0];
  const statusEl = document.getElementById('pdfStatus');
  const ta = document.getElementById('syllabusText');
  if(!file) return;
  if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
    statusEl.textContent = 'That file isn\'t a PDF — try again.';
    statusEl.style.color = 'var(--danger)';
    return;
  }
  statusEl.style.color = 'var(--ink-soft)';
  statusEl.innerHTML = `<span class="spinner" style="border-top-color:var(--navy); border-color:rgba(16,22,29,0.25);"></span> Reading PDF…`;
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let fullText = '';
    for(let p = 1; p <= pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const pageText = content.items.map(it => it.str).join(' ');
      fullText += pageText + '\n\n';
    }
    fullText = fullText.trim();
    if(fullText.length < 40){
      statusEl.textContent = 'Couldn\'t find readable text in that PDF (it may be a scanned image) — try pasting the text instead.';
      statusEl.style.color = 'var(--danger)';
      return;
    }
    ta.value = fullText;
    statusEl.textContent = `Loaded ${pdf.numPages} page${pdf.numPages===1?'':'s'} from "${file.name}". Review below, then parse.`;
    statusEl.style.color = 'var(--green)';
  }catch(e){
    console.error(e);
    statusEl.textContent = 'Couldn\'t read that PDF — try pasting the syllabus text instead.';
    statusEl.style.color = 'var(--danger)';
  }
}

/* =========================================================
   PARSE FLOW (with review-before-save modal)
========================================================= */
async function handleParse(courseId){
  const c = courses.find(x=>x.id===courseId);
  const ta = document.getElementById('syllabusText');
  const btn = document.getElementById('parseBtn');
  const errEl = document.getElementById('parseError');
  const text = ta.value.trim();
  errEl.textContent = '';
  if(text.length < 40){
    errEl.textContent = 'Paste more of the syllabus — need the module/week list with due dates.';
    return;
  }
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Reading syllabus…`;
  try{
    const extracted = await parseSyllabusText(text);
    if(!extracted.length){
      errEl.textContent = "Couldn't find any graded items in that text — try pasting the full module breakdown.";
      btn.disabled = false; btn.textContent = 'Parse syllabus';
      return;
    }
    showReviewModal(c, extracted);
  }catch(e){
    console.error(e);
    errEl.textContent = 'Something went wrong reading that syllabus. Try again, or paste a shorter section.';
    btn.disabled = false; btn.textContent = 'Parse syllabus';
  }
}

function showReviewModal(course, extracted){
  const root = document.getElementById('modalRoot');
  const rows = extracted.map((it)=>`
    <div class="review-item">
      <div class="rtitle">${escapeHtml(it.title)}</div>
      <div class="rmeta">Module ${it.week} · ${typeLabel(it.type)}${
        it.initialPostDay ? ` · post ${it.initialPostDay}, reply ${it.replyDay||'—'}` :
        it.dueDayOfWeek ? ` · due ${it.dueDayOfWeek}` : ' · no day stated (auto-spread Mon–Fri)'
      }</div>
    </div>`).join('');
  root.innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <h2>Found ${extracted.length} items</h2>
        <p class="helper">Review before building the schedule. Items spread across Monday–Friday of each module's week; exams always land after that week's other work.</p>
        <div style="max-height:42vh; overflow-y:auto; margin-top:10px;">${rows}</div>
        <div class="row-actions">
          <button class="btn ghost" onclick="closeModal()">Cancel</button>
          <button class="btn gold" onclick='confirmBuildSchedule(${JSON.stringify(course.id)})'>Build schedule</button>
        </div>
      </div>
    </div>`;
  window._pendingExtraction = extracted;
}

async function confirmBuildSchedule(courseId){
  const c = courses.find(x=>x.id===courseId);
  const extracted = window._pendingExtraction || [];
  const tasks = buildTasksFromExtraction(c, extracted);
  tasksByCourse[courseId] = tasks;
  await saveTasks(courseId);
  closeModal();
  render();
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  window._pendingExtraction = null;
}

async function submitEditCourse(courseId){
  const c = courses.find(x=>x.id===courseId);
  if(!c) return;
  const name = document.getElementById('editCourseName').value.trim();
  const code = document.getElementById('editCourseCode').value.trim();
  const start = document.getElementById('editCourseStart').value;
  if(!name || !start){ alert('Give it a name and a start date.'); return; }
  const dateChanged = start !== c.startDate;
  c.name = name; c.code = code; c.startDate = start;

  if(dateChanged){
    recomputeCourseDates(courseId);
    await saveTasks(courseId);
    activeWeek = null;
  }
  closeModal();
  render();
}
